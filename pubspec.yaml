name: mockmaster
description: A new Flutter project.

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.9.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  get: ^4.6.6
  get_storage: ^2.1.1

  # Payment
  flutter_stripe: ^11.0.0
  http: ^1.2.0

  # Utility Packages
  intl: ^0.19.0       
  logger: ^2.4.0      
  url_launcher: ^6.3.0 
  flutter_native_splash: ^2.4.6
  smooth_page_indicator: ^2.0.1
  internet_connectivity: ^0.0.1
  connectivity_plus: ^6.1.0
  firebase_auth: ^6.5.7
  cloud_firestore: ^6.8.0
  google_generative_ai: ^0.4.6
  flutter_dotenv: ^5.2.1
  pdf: ^3.11.1
  path_provider: ^2.1.4
  permission_handler: ^11.3.1
  printing: ^5.13.4
  google_sign_in: ^6.2.1
  flutter_stripe_web: ^6.3.0
  # Firebase
  firebase_core: ^4.12.1
  flutter_tts: ^4.2.0
  speech_to_text: ^7.0.0

  # UI
  cupertino_icons: ^1.0.8
  iconsax: ^0.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/on_boarding_images/
    - assets/logo/
    - assets/images/
    - .env

  fonts:   
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Light.ttf
          weight: 300
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Italic.ttf
          style: italic
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-MediumItalic.ttf
          weight: 500
          style: italic
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-SemiBoldItalic.ttf
          weight: 600
          style: italic
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-BoldItalic.ttf
          weight: 700
          style: italic